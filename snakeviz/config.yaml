name: "SnakeViz"
version: "1.0.0"
slug: snakeviz
description: "Python cProfile visualizer for Home Assistant"
arch:
  - amd64
  - aarch64
url: "https://jiffyclub.github.io/snakeviz/"
startup: application
boot: manual
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "SnakeViz web interface"
webui: "http://[HOST]:[PORT:8080]/snakeviz/share/snakeviz"
map:
  - type: share
    read_only: false
